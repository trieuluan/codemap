include:
  - compose.yml

x-codemap-volumes: &codemap-volumes
  - .:/workspace:cached
  - codemap_node_modules:/workspace/node_modules
  - ./.codemap/storage:/codemap_storage

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    container_name: codemap-redis-dev
    ports:
      - "6379:6379"

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: codemap/dev-workspace:latest
    container_name: codemap-workspace-dev
    working_dir: /workspace
    volumes: *codemap-volumes
    command: sh -c "sleep infinity"
    env_file:
      - .env
    environment:
      HOST: ${HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3001}
      WEB_PORT: ${WEB_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: codemap/dev-workspace:latest
    container_name: codemap-worker-dev
    working_dir: /workspace/packages/api
    volumes: *codemap-volumes
    command: sh -c "npx tsx watch --inspect=0.0.0.0:9230 --clear-screen=false src/workers/index.ts"
    env_file:
      - .env
    ports:
      - "9230:9230"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_started

  mcp_server:
    image: codemap/dev-workspace:latest
    container_name: codemap-mcp-server-dev
    working_dir: /workspace/packages/mcp-server
    volumes: *codemap-volumes
    command: sh -c "npx @modelcontextprotocol/inspector npx tsx src/index.ts"
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "6274:6274"
      - "6277:6277"
    depends_on:
      workspace:
        condition: service_started

volumes:
  codemap_node_modules:
