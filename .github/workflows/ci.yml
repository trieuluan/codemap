name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared packages
        run: npm run build:shared

      - name: Build CLI
        run: npm run build --workspace=@codemap-ai/cli

      - name: Build MCP
        run: npm run build --workspace=@codemap-ai/mcp

      - name: Build core
        run: npm run build --workspace=@codemap-ai/core

      - name: Run CLI tests
        run: cd packages/cli && node --import tsx --test src/**/*.test.ts

      - name: Type check
        run: npm run build:ts --workspace=@codemap-ai/api
