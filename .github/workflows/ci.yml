name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:shared

      - name: Build CLI
        run: pnpm run build --filter @codemap-ai/cli

      - name: Build MCP
        run: pnpm run build --filter @codemap-ai/mcp

      - name: Build core
        run: pnpm run build --filter @codemap-ai/core

      - name: Run CLI tests
        run: cd packages/cli && node --import tsx --test src/**/*.test.ts

      - name: Type check
        run: pnpm run build:ts --filter @codemap-ai/api
