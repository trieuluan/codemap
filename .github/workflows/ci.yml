name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm run build:shared

      - name: Build code-index
        run: pnpm --filter @codemap-ai/code-index run build

      - name: Build core
        run: pnpm --filter @codemap-ai/core run build

      - name: Build MCP
        run: pnpm --filter @codemap-ai/mcp run build

      - name: Build CLI
        run: pnpm --filter @codemap-ai/cli run build

      - name: Build tool-types
        run: pnpm --filter @codemap-ai/tool-types run build

      - name: Run CLI tests
        run: cd packages/cli && node --import tsx --test src/**/*.test.ts
