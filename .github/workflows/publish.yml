name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm --filter @codemap-ai/shared run build
          pnpm --filter @codemap-ai/code-index run build
          pnpm --filter @codemap-ai/tool-types run build
          pnpm --filter @codemap-ai/core run build
          pnpm --filter @codemap-ai/runtime-node run build
          pnpm --filter @codemap-ai/mcp run build
          pnpm --filter @codemap-ai/cli run build

      - name: Run tests
        run: cd packages/cli && node --import tsx --test src/**/*.test.ts

      - name: Publish packages
        run: |
          pnpm --filter @codemap-ai/shared publish --access public --no-git-checks --no-otp
          pnpm --filter @codemap-ai/code-index publish --access public --no-git-checks --no-otp
          pnpm --filter @codemap-ai/core publish --access public --no-git-checks --no-otp
          pnpm --filter @codemap-ai/runtime-node publish --access public --no-git-checks --no-otp
          pnpm --filter @codemap-ai/tool-types publish --access public --no-git-checks --no-otp
          pnpm --filter @codemap-ai/mcp publish --access public --no-git-checks --no-otp
          pnpm --filter @codemap-ai/cli publish --access public --no-git-checks --no-otp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
