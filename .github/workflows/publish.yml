name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:mcp

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        run: |
          pnpm --filter @codemap-ai/shared publish --access public --no-git-checks
          pnpm --filter @codemap-ai/code-index publish --access public --no-git-checks
          pnpm --filter @codemap-ai/core publish --access public --no-git-checks
          pnpm --filter @codemap-ai/mcp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
