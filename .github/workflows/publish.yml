name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Replace workspace:* with version ranges
        run: bash scripts/prepare-publish.sh

      - name: Build all packages
        run: |
          pnpm run build:shared
          pnpm --filter @codemap-ai/core run build
          pnpm --filter @codemap-ai/code-index run build
          pnpm --filter @codemap-ai/mcp run build
          pnpm --filter @codemap-ai/cli run build
          pnpm --filter @codemap-ai/tool-types run build

      - name: Run tests
        run: cd packages/cli && node --import tsx --test src/**/*.test.ts

      - name: Publish @codemap-ai/shared
        working-directory: packages/shared
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @codemap-ai/code-index
        working-directory: packages/code-index
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @codemap-ai/core
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @codemap-ai/tool-types
        working-directory: packages/tool-types
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @codemap-ai/mcp
        working-directory: packages/mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @codemap-ai/cli
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
