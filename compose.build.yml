include:
  - compose.yml

services:
  postgres:
    container_name: codemap-pg

  redis:
    container_name: codemap-redis

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: codemap/api:latest
    container_name: codemap-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - codemap_storage:/codemap_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: codemap/api:latest
    container_name: codemap-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    command: ["node", "packages/api/dist/workers/index.js"]
    volumes:
      - codemap_storage:/codemap_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: codemap/web:latest
    container_name: codemap-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Runtime-only vars (not baked into the build)
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  codemap_storage:
